<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account — Broken Card Hauls</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand">
        <div class="sigil">✦</div>
        <div>
          <h1>Broken Card Hauls</h1>
          <p>Your mystical MTG collector's spellbook</p>
        </div>
      </div>
      <div class="tag">✧ COLLECT · VALUE · TRADE ✧</div>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card panel">
      <div class="eyebrow">✦ Begin your collection</div>
      <h2>Create your <span class="auth-gradient">collector account</span></h2>
      <p class="auth-intro">Open your own spellbook to save your collection, wishlist, and trade binder across devices.</p>

      <form id="signUpForm" class="signup-form">
        <label for="email">Email address</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required />

        <label for="confirmPassword">Confirm password</label>
        <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Type your password again" required />

        <button type="submit" id="createAccountBtn">Create account ✧</button>
        <p id="signupMessage" class="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Already have an account? <a class="link" href="login.html">Sign in</a></p>
      <p class="auth-switch"><a class="link" href="index.html">← Back to the spellbook</a></p>
    </section>
  </main>
</body>
</html>
